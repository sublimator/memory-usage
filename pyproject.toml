[project]
name = "xahaud-memory-monitor"
version = "0.1.0"
description = "Memory usage monitor for xahaud/rippled binaries with Textual dashboard"
authors = [{name = "Nicholas Dudfield", email = "nick@email.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "xrpl-py>=4.2.0",
    "pydantic>=2.11.7",
    "psutil>=7.0.0",
    "textual>=4.0.0",
    "rich>=14.0.0",
    "aiofiles>=24.1.0",
    "dependency-injector[pydantic2]>=4.48.1",
    "pydantic-settings>=2.10.1",
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "mypy>=1.17.0",
    "ruff>=0.12.4",
    "import-linter>=2.3",
]

[project.scripts]
xahaud-monitor = "memory_usage.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory_usage"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pydantic @field_validator methods use `cls`, not `self`
"memory_usage/config.py" = ["N805"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "types-psutil>=7.2.2.20260408",
]
